name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14", "3.14t", "3.15"]
        os: [ubuntu-latest]
        include:
          - python: "3.14"
            os: macos-latest
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - name: Check free-threaded import
        if: matrix.python == '3.14t'
        run: uv run --locked python -c "import sys, torchid; assert not sys._is_gil_enabled()"
      - name: Check core install without TorchMetrics
        if: matrix.python == '3.11'
        run: |
          uv run --locked --no-dev python -c "from importlib.util import find_spec; from torchid import IntrinsicDimensionLoss; assert find_spec('torchmetrics') is None"
      - run: uv run --locked --extra metrics --group validation pytest -ra --cov=src --cov-report=term-missing

  pre-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
      - name: pre-commit
        run: uv run --all-extras --dev pre-commit run --all-files -v
