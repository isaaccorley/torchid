name: docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/docs.yml'
      - 'docs/**'
      - 'examples/**'
      - 'mkdocs.yml'
      - 'pyproject.toml'
      - 'uv.lock'

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7.3.1

      - name: Convert notebook tutorials to markdown
        run: |
          mkdir -p docs/tutorials
          uv run --python 3.13 --group docs jupyter nbconvert \
            --to markdown \
            --output-dir docs/tutorials \
            examples/embeddings_id.ipynb

      - name: Build docs site
        run: uv run --python 3.13 --with zensical zensical build --clean

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
